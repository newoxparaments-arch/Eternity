<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de denúncias</title><style>body{background:#080808;color:#fff;font:14px system-ui;padding:32px}input,button,select{background:#111;color:#fff;border:1px solid #933;padding:10px;margin:4px}table{width:100%;margin-top:20px}td,th{padding:8px;border-bottom:1px solid #333;text-align:left}</style></head><body><main><h1>Painel de denúncias</h1><p>Área restrita. IP exibido de forma anonimizada.</p><div id="login"><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button onclick="login()">Entrar</button><b id="msg"></b></div><div id="app" hidden><button onclick="location.reload()">Sair</button><button onclick="load()">Atualizar</button><table><thead><tr><th>Data</th><th>Tipo/status</th><th>Cidade/dispositivo</th><th>IP</th><th>Relato</th></tr></thead><tbody id="rows"></tbody></table></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://zyreuptfiqzyqulpeisz.supabase.co",SUPABASE_KEY="sb_publishable_nffhSsr30_Yz7n1yqXIfKA_fzgFGP_G",db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function login(){const x=await db.auth.signInWithPassword({email:email.value,password:password.value});if(x.error)msg.textContent=" Login inválido: "+x.error.message;else{login.hidden=true;app.hidden=false;load()}}async function load(){const x=await db.from("denuncias").select("*").order("created_at",{ascending:false});rows.innerHTML=x.error?"<tr><td colspan=5>Erro de acesso à tabela</td></tr>":x.data.map(v=>`<tr><td>${new Date(v.created_at).toLocaleString("pt-BR")}</td><td>${v.tipo}<br>${v.status}</td><td>${v.cidade||""}<br>${v.device_type||""}</td><td>${v.ip_truncado||""}</td><td>${v.mensagem||""}</td></tr>`).join("")}</script></body></html>
