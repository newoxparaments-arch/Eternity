<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de denúncias — Eternity</title><style>body{margin:0;background:#080808;color:#f5f5f5;font:14px system-ui;padding:32px}main{max-width:1100px;margin:auto}input,button,select{background:#111;color:#fff;border:1px solid #5b1b1b;padding:10px}button{background:#dc2626;cursor:pointer}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #292929;text-align:left;vertical-align:top}small{color:#aaa}.error{color:#f87171}</style></head><body><main><h1>Painel de denúncias</h1><p><small>Área restrita. O IP exibido é sempre truncado/anonimizado.</small></p><div id="login"><input id="email" type="email" placeholder="E-mail autorizado"><input id="password" type="password" placeholder="Senha"><button onclick="login()">Entrar</button><p id="msg" class="error"></p></div><div id="app" hidden><button onclick="logout()">Sair</button><div class="toolbar"><select id="status"><option value="">Todos os status</option><option>nova</option><option>em_analise</option><option>encerrada</option><option>arquivada</option></select><button onclick="loadReports()">Atualizar</button></div><div class="table"><table><thead><tr><th>Data</th><th>Tipo / status</th><th>Cidade / dispositivo</th><th>IP truncado</th><th>Relato</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://zyreuptfiqzyqulpeisz.supabase.co',KEY='sb_publishable_nffhSsr30_Yz7n1yqXIfKA_fzgFGP_G';const db=supabase.createClient(URL,KEY);async function login(){const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.textContent='Login inválido.';else boot()}async function logout(){await db.auth.signOut();location.reload()}async function boot(){const {data:{session}}=await db.auth.getSession();if(!session)return;loginDiv=document.getElementById('login');loginDiv.hidden=true;document.getElementById('app').hidden=false;loadReports()}async function loadReports(){let q=db.from('denuncias').select('*').order('created_at',{ascending:false});if(status.value)q=q.eq('status',status.value);const {data,error}=await q;rows.innerHTML=error?'<tr><td colspan="5">Erro ao carregar.</td></tr>':data.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('pt-BR')}</td><td>${r.tipo}<br><select onchange="changeStatus('${r.id}',this.value)"><option ${r.status==='nova'?'selected':''}>nova</option><option ${r.status==='em_analise'?'selected':''}>em_analise</option><option ${r.status==='encerrada'?'selected':''}>encerrada</option><option ${r.status==='arquivada'?'selected':''}>arquivada</option></select></td><td>${r.cidade||'não informada'}<br>${r.device_type}</td><td>${r.ip_truncado||'não registrado'}</td><td><b>${r.nome||'Anônimo'}</b><br>${r.contato||''}<br>${r.mensagem}</td></tr>`).join('')}async function changeStatus(id,value){await db.from('denuncias').update({status:value}).eq('id',id);loadReports()}boot()</script></body></html>
