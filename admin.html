ption>arquivada</option></select><button id="refreshReports">Atualizar</button></div><div class="table"><table><thead><tr><th>Data</th><th>Tipo/status</th><th>Cidade/dispositivo</th><th>IP truncado</th><th>Relato</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="members" class="panel"><h2>Gerenciar membros</h2><form id="memberForm" class="member-form"><input type="hidden" id="memberId"><input id="memberName" required placeholder="Nome"><input id="memberRole" value="Membro" placeholder="Cargo"><input id="memberColor" value="#c084fc" type="color" title="Cor"><input id="memberCode" value="//member" placeholder="Código"><input id="memberOrder" value="100" type="number" placeholder="Ordem"><input id="memberPhoto" type="file" accept="image/*"><input id="memberPhotoUrl" placeholder="URL da foto (opcional)"><textarea id="memberMotto" class="wide" placeholder="Frase do perfil"></textarea><textarea id="memberDescription" class="wide" placeholder="Descrição"></textarea><label><input id="memberActive" type="checkbox" checked> Perfil ativo</label><div class="wide"><button type="submit">Salvar membro</button><button type="button" id="cancelMember">Limpar</button></div></form><div class="table"><table><thead><tr><th>Perfil</th><th>Cargo</th><th>Ordem</th><th>Status</th><th>Ações</th></tr></thead><tbody id="memberRows"></tbody></table></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://zyreuptfiqzyqulpeisz.supabase.co',SUPABASE_KEY='sb_publishable_nffhSsr30_Yz7n1yqXIfKA_fzgFGP_G',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);function attachmentLinks(value){if(!value)return '';let urls=[];try{const parsed=JSON.parse(value);urls=Array.isArray(parsed)?parsed:[value]}catch(_){urls=[value]}return urls.map((url,i)=>`<a href="${url}" target="_blank" rel="noopener">Abrir foto ${i+1}</a>`).join(' · ')}function showTab(tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===tab));if(tab==='members')loadMembers()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));async function doLogin(){const x=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(x.error)$('msg').textContent='Login inválido: '+x.error.message;else{$('login').hidden=true;$('app').hidden=false;loadReports()}}$('enter').onclick=doLogin;$('exit').onclick=()=>db.auth.signOut().then(()=>location.reload());async function loadReports(){let q=db.from('denuncias').select('*').order('created_at',{ascending:false});if($('status').value)q=q.eq('status',$('status').value);const x=await q;$('rows').innerHTML=x.error?'<tr><td colspan=5>Erro de acesso à tabela</td></tr>':x.data.map(v=>`<tr><td>${new Date(v.created_at).toLocaleString('pt-BR')}</td><td>${v.tipo}<br>${v.status}</td><td>${v.cidade||''}<br>${v.device_type||''}</td><td>${v.ip_truncado||''}</td><td><b>${v.nome||'Anônimo'}</b><br>${v.contato||''}<br>${v.mensagem||''}${v.attachment_url?`<br>${attachmentLinks(v.attachment_url)}`:''}</td></tr>`).join('')}$('refreshReports').onclick=loadReports;$('status').onchange=loadReports;let members=[];const DEFAULT_MEMBERS=[

];async function loadMembers(){const x=await db.from('members').select('*').order('display_order',{ascending:true}).order('created_at',{ascending:true});const remote=x.data||[];const byName=new Map(remote.map(v=>[v.name.toLowerCase(),v]));members=DEFAULT_MEMBERS.map((v,i)=>byName.get(v.name.toLowerCase())||({...v,id:'default-'+i}));remote.forEach(v=>{if(!DEFAULT_MEMBERS.some(d=>d.name.toLowerCase()===v.name.toLowerCase()))members.push(v)});members.sort((a,b)=>(a.display_order??100)-(b.display_order??100));$('memberRows').innerHTML=x.error?'<tr><td colspan=5>Crie a tabela members executando o schema.sql.</td></tr>':members.map(v=>`<tr><td>${v.photo_url?`<img class=member-photo src="${v.photo_url}" alt="">`:''}<b>${v.name}</b></td><td>${v.role}</td><td>${v.display_order}</td><td>${v.active?'Ativo':'Oculto'}</td><td><button onclick="editMember('${v.id}')">Editar</button><button onclick="removeMember('${v.id}')">Excluir</button></td></tr>`).join('')}window.editMember=id=>{const v=members.find(x=>x.id===id);if(!v)return;$('memberId').value=v.id;$('memberName').value=v.name;$('memberRole').value=v.role;$('memberColor').value=v.color||'#c084fc';$('memberCode').value=v.code||'//member';$('memberOrder').value=v.display_order||100;$('memberPhotoUrl').value=v.photo_url||'';$('memberMotto').value=v.motto||'';$('memberDescription').value=v.description||'';$('memberActive').checked=v.active;};window.removeMember=async id=>{if(confirm('Excluir este membro?')){await db.from('members').delete().eq('id',id);loadMembers()}};$('cancelMember').onclick=()=>$('memberForm').reset();$('memberForm').onsubmit=async e=>{e.preventDefault();let photo=$('memberPhotoUrl').value.trim()||null;const f=$('memberPhoto').files[0],id=$('memberId').value;if(f){const path=(id||crypto.randomUUID())+'/'+f.name.replace(/[^a-z0-9._-]/gi,'_');const up=await db.storage.from('member-photos').upload(path,f,{upsert:true});if(up.error){$('msg').textContent='Falha no upload da foto: '+up.error.message;return}photo=db.storage.from('member-photos').getPublicUrl(path).data.publicUrl}const row={name:$('memberName').value.trim(),role:$('memberRole').value.trim()||'Membro',color:$('memberColor').value,code:$('memberCode').value.trim()||'//member',display_order:Number($('memberOrder').value)||100,photo_url:photo,motto:$('memberMotto').value.trim(),description:$('memberDescription').value.trim(),active:$('memberActive').checked};const x=id&&!id.startsWith('default-')?await db.from('members').update(row).eq('id',id):await db.from('members').insert(row);if(x.error)$('msg').textContent='Não foi possível salvar: '+x.error.message;else{$('memberForm').reset();$('memberId').value='';$('memberActive').checked=true;loadMembers()}};</script></body></html>
